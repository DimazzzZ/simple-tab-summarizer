name: Reusable Checks

on:
  workflow_call:

# Opt into Node 24 for JavaScript actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the release baseline. Node 26 is covered because a
        # Node-26-specific V8 JSON error-message change exposed the SSE parser
        # fragility fixed in api/codex-client.js — CI must guard that path.
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests
        run: npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate manifest.json
        run: |
          node -e "
            const manifest = require('./manifest.json');
            if (manifest.manifest_version !== 3) {
              console.error('manifest_version must be 3');
              process.exit(1);
            }
            if (!manifest.name || !manifest.version || !manifest.description) {
              console.error('Missing required manifest fields');
              process.exit(1);
            }
            console.log('Manifest validation passed');
          "
          node scripts/validate-extension-files.mjs .

      - name: Validate ESM import graph
        run: node scripts/validate-extension-imports.mjs .

      - name: Check required files exist
        run: |
          for file in manifest.json background.js content.js popup.html popup.js sidebar.html sidebar.js ui-controller.js styles.css PRIVACY.md README.md; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Check icon assets
        run: |
          for icon in icons/icon16.png icons/icon48.png icons/icon128.png; do
            if [ ! -f "$icon" ]; then
              echo "Missing icon: $icon"
              exit 1
            fi
          done
          echo "All icon assets present"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install zip utility
        run: sudo apt-get install -y zip

      - name: Build extension package
        run: npm run build

      - name: Verify a package ZIP was produced
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          ZIP_FILE="dist/simple-tab-summarizer-v${VERSION}.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ Expected package not produced: $ZIP_FILE"
            ls -la dist || true
            exit 1
          fi
          # Exactly one of our packages should remain (cleanup step ran).
          COUNT=$(find dist -maxdepth 1 -name 'simple-tab-summarizer-v*.zip' | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "❌ Expected exactly one package zip in dist/, found $COUNT"
            find dist -maxdepth 1 -name 'simple-tab-summarizer-v*.zip'
            exit 1
          fi
          echo "✅ Build produced $ZIP_FILE"
