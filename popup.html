<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Group Summarizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📑 Tab Group Summarizer</h1>
    </header>

    <!-- Auth Section -->
    <div id="auth-section" class="section">
      <div id="auth-status" class="auth-box">
        <span id="auth-icon" class="auth-icon">🔌</span>
        <span id="auth-text">Not connected</span>
      </div>
      <button id="connect-btn" class="btn btn-primary">
        <span class="btn-text">Connect to ChatGPT</span>
      </button>
      <button id="disconnect-btn" class="btn btn-secondary hidden">
        <span class="btn-text">Disconnect</span>
      </button>
    </div>

    <!-- Group Selection -->
    <div id="group-section" class="section">
      <label for="group-select">Select Tab Group:</label>
      <select id="group-select" class="group-select">
        <option value="">-- Select a group --</option>
      </select>
      <div id="no-groups" class="no-groups hidden">
        <p>No tab groups found. Create one by right-clicking a tab → "Add tab to new group".</p>
      </div>
    </div>

    <!-- Page Selection (Checkboxes) -->
    <div id="pages-section" class="section hidden">
      <div class="pages-header">
        <label>Select Pages:</label>
        <div class="select-all-btns">
          <button id="select-all-btn" class="btn-small">Select All</button>
          <button id="deselect-all-btn" class="btn-small">Deselect All</button>
        </div>
      </div>
      <div id="pages-list" class="pages-list"></div>
    </div>

    <!-- Language Selection -->
    <div id="language-section" class="section">
      <label for="language-select">Summary Language:</label>
      <select id="language-select" class="language-select">
        <option value="Arabic">Arabic</option>
        <option value="Bengali">Bengali</option>
        <option value="Bulgarian">Bulgarian</option>
        <option value="Catalan">Catalan</option>
        <option value="Chinese">Chinese</option>
        <option value="Croatian">Croatian</option>
        <option value="Czech">Czech</option>
        <option value="Danish">Danish</option>
        <option value="Dutch">Dutch</option>
        <option value="English" selected>English</option>
        <option value="Estonian">Estonian</option>
        <option value="Finnish">Finnish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Greek">Greek</option>
        <option value="Hebrew">Hebrew</option>
        <option value="Hindi">Hindi</option>
        <option value="Hungarian">Hungarian</option>
        <option value="Indonesian">Indonesian</option>
        <option value="Italian">Italian</option>
        <option value="Japanese">Japanese</option>
        <option value="Korean">Korean</option>
        <option value="Latvian">Latvian</option>
        <option value="Lithuanian">Lithuanian</option>
        <option value="Malay">Malay</option>
        <option value="Norwegian">Norwegian</option>
        <option value="Persian">Persian</option>
        <option value="Polish">Polish</option>
        <option value="Portuguese">Portuguese</option>
        <option value="Romanian">Romanian</option>
        <option value="Russian">Russian</option>
        <option value="Serbian">Serbian</option>
        <option value="Slovak">Slovak</option>
        <option value="Slovenian">Slovenian</option>
        <option value="Spanish">Spanish</option>
        <option value="Swedish">Swedish</option>
        <option value="Thai">Thai</option>
        <option value="Turkish">Turkish</option>
        <option value="Ukrainian">Ukrainian</option>
        <option value="Urdu">Urdu</option>
        <option value="Vietnamese">Vietnamese</option>
      </select>
    </div>

    <!-- Action Buttons -->
    <div id="action-section" class="section">
      <button id="summarize-btn" class="btn btn-primary" disabled>
        <span class="btn-text">Summarize Selected</span>
      </button>
    </div>

    <!-- Loading Section -->
    <div id="loading-section" class="section hidden">
      <div class="loading-container">
        <div class="spinner"></div>
        <p id="loading-text">Extracting content from tabs...</p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text">0 / 0 tabs processed</p>
      </div>
    </div>

    <!-- Summary Section -->
    <div id="summary-section" class="section hidden">
      <h2>📝 Summary</h2>
      <div id="summary-content" class="summary-box"></div>
    </div>

    <!-- Debug Console -->
    <div id="debug-section" class="section hidden">
      <div class="debug-header">
        <label>Debug Console:</label>
        <button id="clear-debug-btn" class="btn-small">Clear</button>
      </div>
      <div id="debug-console" class="debug-console"></div>
    </div>

    <!-- Debug Toggle -->
    <div id="debug-toggle-section" class="section">
      <label class="debug-toggle-label">
        <input type="checkbox" id="debug-toggle">
        <span>Show debug console</span>
      </label>
    </div>

    <!-- Error Section -->
    <div id="error-section" class="section hidden">
      <div class="error-box">
        <span class="error-icon">⚠️</span>
        <p id="error-message"></p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
